<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrid Living · Proposal Generator</title>
<link rel="stylesheet" href="styles.css"><link rel="icon" href="icons/favicon-32.png"><style>
:root{--pgold:#c1a463;--pline:#ded9ce}*{box-sizing:border-box}.pg-layout{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(350px,1fr);gap:24px;padding:24px 0 55px;align-items:start}.pg-stack{display:grid;gap:24px}.pg-panel{border:1px solid var(--line,#ded9ce);border-radius:16px;padding:20px;background:var(--surface,#fff)}.pg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pg-wide{grid-column:1/-1}.pg-layout label{display:grid;gap:5px;font-size:13px}.pg-layout input:not([type=checkbox]):not([type=file]),.pg-layout select,.pg-layout textarea{width:100%;min-width:0;padding:10px;border:1px solid var(--line,#d8d8d8);border-radius:8px;background:var(--field,#fff);color:var(--text,#232a31);font:inherit}.pg-layout h2{font-size:20px;margin:0 0 16px}.pg-stack .pg-panel{min-width:0}.pg-opt{border:1px solid var(--pline);border-top:3px solid var(--pgold);border-radius:14px;padding:15px;display:grid;gap:14px;margin-bottom:14px}.pg-opt-head,.pg-actions,.pg-totals>div{display:flex;align-items:center;justify-content:space-between;gap:10px}.pg-actions{justify-content:flex-start;flex-wrap:wrap}.pg-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:8px 13px;border:1px solid var(--pline);border-radius:9px;background:var(--surface,#fff);color:var(--text,#262b30);cursor:pointer;font:inherit}.pg-btn.primary{background:var(--pgold);color:#1f2530;border-color:var(--pgold);font-weight:650}.pg-btn:disabled{opacity:.5;cursor:default}.pg-meta{font-size:12px;opacity:.76}.pg-alert{font-size:13px;padding:10px;border-radius:9px;background:#f7efde;color:#594015}.pg-totals{padding:11px;background:var(--field,#f6f5f1);border:1px solid var(--pline);border-radius:10px;font-size:13px}.pg-totals>div{padding:3px 0}.pg-totals .total{border-top:1px solid var(--pline);padding-top:8px;margin-top:6px;font-size:17px;font-weight:700}.pg-fee{display:grid;grid-template-columns:minmax(80px,2fr) minmax(65px,1fr) minmax(94px,1.25fr) auto;gap:6px;margin:6px 0}.pg-fee .pg-btn{padding:6px}.pg-preview{max-height:73vh;overflow:auto;background:white;border:1px solid #ded9ce;border-radius:12px;padding:18px;color:#1f2934}.pg-doc{font:13px/1.55 Georgia,serif;color:#1f2934}.pg-doc .heading{border-bottom:2px solid #c1a463;padding-bottom:10px;display:flex;align-items:center;justify-content:space-between}.pg-doc .heading img{max-height:38px;max-width:150px}.pg-doc h3{font-size:22px;font-weight:400;margin:15px 0 5px}.pg-doc hr{border:0;border-top:1px solid #e4dccc;margin:16px 0}.pg-doc table{width:100%;border-collapse:collapse;font-size:11px}.pg-doc td,.pg-doc th{border-bottom:1px solid #e4dccc;padding:8px 5px;text-align:left;vertical-align:top}.pg-doc .photo{display:block;width:100%;max-height:270px;object-fit:cover;margin-top:12px;border-radius:6px}.pg-doc .page{page-break-after:always;padding:4px 0 20px}.pg-doc .red{color:#ad342e;font-weight:600}.pg-doc .fine{font-size:11px;color:#727782}.pg-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 15px;padding:14px;border:1px solid var(--pline);border-radius:10px;background:var(--field,#faf9f7)}.pg-pick .full{grid-column:1/-1}.pg-pick-info{display:flex;gap:12px;align-items:flex-start;padding:10px;border:1px solid var(--pline);border-radius:9px;grid-column:1/-1;background:var(--surface,#fff)}.pg-pick-info img{width:100px;height:76px;object-fit:cover;border-radius:6px}.pg-pick-info a{overflow-wrap:anywhere}.pg-check{display:flex!important;align-items:center;gap:8px}.pg-hidden{display:none!important}#printArea{display:none}.pg-tag{font-size:11px;border:1px solid var(--pline);border-radius:20px;padding:2px 8px}.pg-modal{border:1px solid var(--pline);border-radius:16px;max-width:480px;width:calc(100% - 32px);padding:20px}.pg-modal form{display:grid;gap:13px}.pg-modal input,.pg-modal textarea{padding:9px;width:100%;border:1px solid #bbb;border-radius:8px}@media(max-width:950px){.pg-layout{grid-template-columns:1fr}}@media(max-width:550px){.pg-grid,.pg-pick{grid-template-columns:1fr}.pg-wide,.pg-pick .full,.pg-pick-info{grid-column:1}.pg-fee{grid-template-columns:1fr 1fr}.pg-fee>*:first-child{grid-column:1/-1}}@media print{body.printing>*:not(#printArea){display:none!important}body.printing #printArea{display:block!important}.pg-doc .page{break-after:page}@page{margin:14mm}}
.pg-doc .profile-sheet{background:#fff;color:#202020;font-family:Arial,Helvetica,sans-serif}.pg-doc .profile-logo{padding:0 0 12px;border-bottom:0}.pg-doc .profile-hero{height:190px;width:100%;background:#e9e6e0;overflow:hidden}.pg-doc .profile-hero img{width:100%;height:100%;object-fit:cover}.pg-doc .profile-placeholder{display:flex;align-items:center;justify-content:center;color:#6d6b66;background:#efede8;font-size:11px}.pg-doc .profile-lower{display:grid;grid-template-columns:45% 55%;min-height:440px}.pg-doc .profile-left{background:#fff8ed;border-right:8px solid #c1a463;padding:12px 10px 14px;border-top-right-radius:40px}.pg-doc .profile-gallery{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,116px);gap:7px}.pg-doc .profile-gallery img{display:block;width:100%;height:100%;object-fit:cover;border-radius:3px}.pg-doc .profile-left h4,.pg-doc .profile-right h4{font-size:14px;margin:14px 0 5px;text-decoration:underline}.pg-doc .profile-right{padding:12px 14px}.pg-doc .profile-right h3{text-align:center;font-size:21px;font-weight:700;text-decoration:underline;margin:6px 0}.pg-doc .profile-address{text-align:right;font-style:italic;font-size:12px}.pg-doc .profile-distance{text-align:center;font-size:12px;font-weight:700;font-style:italic}.pg-doc .profile-desc{text-align:center;font-size:12px;line-height:1.5}.pg-doc .profile-right ul,.pg-doc .profile-left ul{margin:5px 0 7px;padding-left:18px;font-size:12px}.pg-doc .profile-footer{font-size:10px;color:#686868;margin-top:10px}.pg-opt .pg-gallery-help{font-size:12px;color:var(--muted,#656565)}.pg-opt .pg-photo-count{font-size:12px;color:#675c42}.pg-doc .profile-left li,.pg-doc .profile-right li{margin:3px 0}@media print{.pg-doc .profile-sheet{width:100%;break-inside:avoid}.pg-doc .profile-hero{height:185px}.pg-doc .profile-gallery{grid-template-rows:repeat(3,108px)}.pg-doc .profile-lower{min-height:410px}.pg-doc .profile-sheet.page{page-break-after:always}}
/* Logo sizing: apply in all three places (email, summary PDF, property sheets). */
.pg-doc .heading img,
.pg-doc .profile-logo img {
  display:block !important;
  width:auto !important;
  height:42px !important;
  max-width:190px !important;
  max-height:42px !important;
  object-fit:contain !important;
  object-position:left center;
  flex:none;
}
.pg-doc .profile-logo {
  display:flex;
  align-items:center;
  justify-content:flex-start;
  height:60px;
  padding:3px 0 12px;
  overflow:hidden;
}
.pg-doc .profile-sheet {min-width:0;width:100%;max-width:100%;overflow:hidden;}
.pg-doc .profile-hero {height:190px;max-width:100%;}
.pg-doc .profile-hero img{display:block;max-width:100%;}
.pg-doc .profile-lower {grid-template-columns:minmax(0,45%) minmax(0,55%);}
.pg-doc .profile-left,.pg-doc .profile-right {min-width:0;overflow-wrap:anywhere;}
.pg-doc .profile-gallery > * {min-width:0;max-width:100%;}
/* Smaller browser/phone preview: maintain a usable image and readable text. */
.pg-preview{min-width:0;container-type:inline-size;}
@container (max-width:580px){
  .pg-doc .profile-logo{height:50px;padding-bottom:8px}
  .pg-doc .profile-logo img{height:34px!important;max-height:34px!important;max-width:155px!important}
  .pg-doc .profile-hero{height:155px}
  .pg-doc .profile-lower{grid-template-columns:1fr;}
  .pg-doc .profile-left{border-right:0;border-bottom:5px solid #c1a463;border-top-right-radius:20px;}
  .pg-doc .profile-gallery{grid-template-rows:repeat(3,95px);}
  .pg-doc .profile-right{padding:15px 10px;}
  .pg-doc .profile-desc{text-align:left;}
}
@media(max-width:550px){
  .pg-layout{gap:12px;padding-top:12px}
  .pg-panel{padding:12px}
  .pg-preview{padding:10px;max-height:none}
  .pg-doc .heading{gap:12px;flex-wrap:wrap}
  .pg-doc .heading img{height:30px!important;max-height:30px!important;max-width:145px!important}
}
/* Print ignores preview-only mobile/container adaptations. */
@media print{
  #printArea .pg-doc .profile-sheet{width:100%;overflow:visible;break-inside:avoid;}
  #printArea .pg-doc .profile-logo{height:56px;overflow:hidden;}
  #printArea .pg-doc .profile-logo img{height:40px!important;max-height:40px!important;max-width:185px!important;}
  #printArea .pg-doc .profile-hero{height:185px;}
  #printArea .pg-doc .profile-lower{display:grid;grid-template-columns:minmax(0,45%) minmax(0,55%);min-height:410px;}
  #printArea .pg-doc .profile-gallery{grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,108px);}
  #printArea .pg-doc .profile-left{border-right:8px solid #c1a463;border-bottom:0;border-top-right-radius:40px;}
}

/* Property-specific nearby attractions, editable for each proposal option. */
.pg-nearby{display:grid;gap:10px;margin:12px 0;border:1px solid var(--line,#ded9ce);border-radius:10px;padding:12px;min-width:0}
.pg-nearby legend{font-weight:700;padding:0 6px}
.pg-nearby label{display:grid;gap:5px}
.pg-nearby textarea{width:100%;min-height:62px;resize:vertical}
.pg-doc .profile-nearby-group{margin:8px 0;font-size:11px;line-height:1.35;overflow-wrap:anywhere}
.pg-doc .profile-nearby-group b{display:block;font-size:11px}
.pg-doc .profile-nearby-group ul{margin:2px 0 4px;padding-left:16px;font-size:11px}
.pg-doc .profile-nearby-empty{display:block;font-style:italic;color:#777;font-size:10px;margin-top:2px}
@media print{#printArea .pg-doc .profile-nearby-group{break-inside:avoid}}
</style></head><body>
<header class="topbar"><div class="wrap bar"><div class="brand"><img src="logo.png" alt="Astrid Living"><span class="studio">Proposal Generator</span></div><div class="bar-right"><a href="./" class="btn">← Sourcing Studio</a></div></div></header>
<main class="wrap pg-layout"><div class="pg-stack"><section class="pg-panel"><h2>Proposal details</h2><div class="pg-grid"><label class="pg-wide">Proposal name<input id="pname" value="Temporary Housing Proposal"></label><label>Client / company<input id="client" placeholder="Client name"></label><label>Guest name<input id="guest" value="TBD"></label><label>Move-in<input id="mi" type="date"></label><label>Move-out<input id="mo" type="date"></label><label>Valid until<input id="valid" type="date"></label><label class="pg-wide">Preferred location<input id="ref" placeholder="e.g. 711 3rd Ave, New York, NY"></label><label class="pg-wide">General comments<textarea id="gc" rows="2"></textarea></label><label class="pg-wide">Attachments<input id="files" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.docx"><span id="flist" class="pg-meta">Attach these to your outgoing email manually.</span></label></div></section>
<section class="pg-panel"><h2>Astrid Inventory <span class="pg-tag" id="inventoryCount">Loading</span></h2><div class="pg-pick"><label class="full">Source<select id="sourceFilter"><option value="all">All sources</option><option value="inv">Astrid inventory</option><option value="short">Shortlist (from the main page)</option><option value="web">Found on the web (recent Live searches)</option></select></label><label>City<select id="cityFilter"><option value="">All cities</option></select></label><label>Bedrooms<select id="bedsFilter"><option value="">Any</option><option value="0">Studio</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select></label><label class="full">Find property by name / ID<input id="inventoryQuery" placeholder="The Landon, 26074, ..."></label><label class="full">Astrid property<select id="inventorySelect"><option value="">Select a property</option></select></label><div id="inventoryInfo" class="pg-pick-info pg-hidden"></div><div class="full pg-actions"><button class="pg-btn primary" type="button" id="useInventory">+ Add selected property to proposal</button><button class="pg-btn" type="button" id="reloadInventory">Reload inventory</button></div><div class="full pg-meta" id="inventoryStatus" aria-live="polite">Reading inventory.csv from this website.</div></div><p class="pg-meta">Inventory details are not proof of real-time availability. Verify the property, unit, amenities and final offer before sending.</p></section>
<section class="pg-panel"><h2>Property options</h2><div id="opts"></div><button class="pg-btn primary" id="add" type="button">+ Add property option</button></section></div>
<aside class="pg-panel"><h2>Preview</h2><div class="pg-actions" style="margin-bottom:14px"><button class="pg-btn primary" id="t-mail" type="button">Email</button><button class="pg-btn" id="t-pdf" type="button">PDF & profiles</button></div><div class="pg-preview"><div id="out" class="pg-doc"></div></div><div class="pg-actions" style="margin-top:14px"><button class="pg-btn primary" id="copy" type="button">Copy email</button><button class="pg-btn" id="print" type="button">Print / Save as PDF</button></div><p id="msg" class="pg-meta" aria-live="polite"></p></aside></main>
<dialog class="pg-modal" id="dp"><form id="fp"><h2>New property</h2><label>Name<input name="name" required></label><label>Address<input name="addr" required></label><label>Amenities (comma-separated)<input name="am"></label><label>Housekeeping<input name="hk"></label><label>Description<textarea name="desc" rows="3"></textarea></label><label>Room types (name | size, one per line)<textarea name="units" rows="3"></textarea></label><div class="pg-actions"><button class="pg-btn" type="button" id="pc">Cancel</button><button class="pg-btn primary" type="submit">Save property</button></div></form></dialog><div id="printArea"></div>
<script src="config.js"></script>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+(Number.isFinite(n)?n:0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),num=v=>Number.parseFloat(v)||0,months=['January','February','March','April','May','June','July','August','September','October','November','December'];
const date=d=>{if(!d)return '—';const a=d.split('-');return months[+a[1]-1]+' '+(+a[2])+', '+a[0]},nights=(a,b)=>a&&b?Math.max(0,Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/86400000)):0;
const get=(k,def)=>{try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}},set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const BASE=[{id:'midtown',name:'Midtown East ApartHotel',addr:'East 49th St. & 1st Ave. New York, NY 10017',am:['24-Hour Front Desk','Elevator','Laundry Onsite'],hk:'Bi-weekly (complimentary)',desc:'',units:[{n:'Studio Queen',s:'350 sq.ft.',k:'Fully equipped kitchen'},{n:'One Bedroom',s:'520 sq.ft.',k:'Fully equipped kitchen'}]},{id:'marmara',name:'The Marmara Residence',addr:'East 32nd St. & Park Ave. New York, NY 10016',am:['24-Hour Front Desk','Elevator','Indoor Swimming Pool','Laundry Onsite'],hk:'Weekly (complimentary)',desc:'',units:[{n:'Studio Queen',s:'400 sq.ft.',k:'Kitchenette with two-burner stoves'}]},{id:'sora',name:'Sora Residences',addr:'E Hazel & Centinela Ave, Inglewood, CA 90302',am:['Pool','Fitness Center','In-unit Laundry','Wi-Fi'],hk:'On request',desc:'Modern furnished residence.',units:[{n:'1BR / 1BA',s:'607 sq.ft.',k:'Fully equipped kitchen'}]}];
let custom=get('ast.props',[]),inventory=[],inventoryItems=[],shortItems=[],webItems=[],tab='mail',S=get('ast.draft',{opts:[]});if(!Array.isArray(S.opts))S.opts=[];S.known=S.known||{};const fields=['pname','client','guest','mi','mo','valid','ref','gc'];fields.forEach(k=>{if(S[k]!=null)$(k).value=S[k]});
const props=()=>BASE.concat(custom,inventoryItems,shortItems,webItems),P=id=>props().find(p=>p.id===id)||(S.known&&S.known[id])||null;
function featFor(p,u){const r=p.inventoryRow;if(!r)return'';const b=Number(r.beds),ba=Number(r.baths),L=[];if(r.beds!=='')L.push(b===0?'Studio':b+(b===1?' bedroom':' bedrooms'));if(r.baths)L.push(ba+(ba===1?' bathroom':' bathrooms'));if(r.sleeps)L.push('Sleeps '+r.sleeps);return L.join('\n')}
function newOpt(id){const p=P(id)||BASE[0],u=p.units[0]||{};return{p:p.id,u:u.n||'',s:u.s||'',k:'',feat:featFor(p,u),own:false,mi:'',mo:'',rate:'',basis:'night',tm:'waived',taxes:[{label:'Taxes',amt:14.75,type:'pct'}],dist:'',distAuto:true,fees:[],photo:'',gallery:[],nearby:{grocery:'',gym:'',transport:''},note:''}}
if(!S.opts.length)S.opts.push(newOpt());S.opts.forEach(o=>{if(!Array.isArray(o.taxes))o.taxes=num(o.tp)>0?[{label:'Taxes',amt:o.tp,type:'pct'}]:[];o.feat=o.feat??'';if(o.distAuto===undefined)o.distAuto=!o.dist;o.fees=Array.isArray(o.fees)?o.fees:[];o.gallery=Array.isArray(o.gallery)?o.gallery.filter(u=>/^https:/.test(u)):[];o.nearby=o.nearby&&typeof o.nearby==='object'?o.nearby:{grocery:'',gym:'',transport:''};});
function save(){fields.forEach(k=>S[k]=$(k).value);set('ast.draft',{...Object.fromEntries(fields.map(k=>[k,S[k]])),known:S.known||{},opts:S.opts.map(o=>({...o,photo:/^https:/.test(o.photo||'')?o.photo:'',gallery:(o.gallery||[]).filter(u=>/^https:/.test(u))}))})}
const range=o=>o.own?{a:o.mi||'',b:o.mo||''}:{a:$('mi').value,b:$('mo').value};
function totals(o){const d=range(o),n=nights(d.a,d.b),r=num(o.rate),dy=n>0?n+1:0,acc=(o.basis==='month'?n/30:o.basis==='day'?dy:n)*r,feeLines=o.fees.map(f=>{const a=num(f.amt),q=f.freq==='night'?n:f.freq==='day'?dy:f.freq==='month'?n/30:1;return{label:f.label||'Fee',freq:f.freq,unit:a,qty:q,amt:a*q}}),fees=feeLines.reduce((q,x)=>q+x.amt,0),taxLines=(o.taxes||[]).map(x=>({label:x.label||'Tax',type:x.type,pct:num(x.amt),amt:x.type==='flat'?num(x.amt):(acc+fees)*num(x.amt)/100})),tax=taxLines.reduce((q,x)=>q+x.amt,0),waived=o.tm==='waived';return{n,dy,r,acc,fees,feeLines,tax,taxLines,waived,total:acc+fees+(waived?0:tax)}}

const KEY=()=>window.TOMTOM_KEY||'',sleep=ms=>new Promise(r=>setTimeout(r,ms)),GEO={},mi=x=>(x<0.1?x.toFixed(2):x.toFixed(1))+' mi';
async function tt(url){for(let a=0;a<3;a++){const r=await fetch(url);if(r.status===429){await sleep(800*(a+1));continue}if(!r.ok)throw Error('TomTom error '+r.status);return r.json()}throw Error('TomTom is busy. Wait a minute and try again.')}
async function geo(q){q=String(q||'').trim();if(!q)throw Error('Enter an address first.');if(GEO[q])return GEO[q];const d=await tt(`https://api.tomtom.com/search/2/geocode/${encodeURIComponent(q)}.json?key=${encodeURIComponent(KEY())}&limit=1`),r=d.results&&d.results[0];if(!r)throw Error('Could not find: '+q);return GEO[q]={lat:r.position.lat,lng:r.position.lon}}

async function runNearby(i){const o=S.opts[i];if(!o)return;try{if(!KEY())throw Error('TomTom key missing in config.js');say(i,'[data-nstat]','Searching…');const p=P(o.p)||BASE[0],a=await propPoint(p),out={};let total=0;for(const k of Object.keys(NBQ)){const seen=new Map();for(const q of NBQ[k]){const d=await tt(`https://api.tomtom.com/search/2/poiSearch/${encodeURIComponent(q)}.json?key=${encodeURIComponent(KEY())}&lat=${a.lat}&lon=${a.lng}&radius=3000&limit=10&relatedPois=off`);for(const r of d.results||[]){const n=r.poi&&r.poi.name;if(n&&!seen.has(n))seen.set(n,r.dist||0)}await sleep(300)}out[k]=[...seen].sort((x,y)=>x[1]-y[1]).slice(0,8).map(([n,m])=>`${n} — ${mi(m/1609.344)} (≈${Math.max(1,Math.round(m*1.3/80))} min walk)`);total+=out[k].length}NB[i]=out;renderOpts();say(i,'[data-nstat]',total?'Pick places from the lists below.':'No places found within about 2 miles.')}catch(err){say(i,'[data-nstat]',err.message)}}

function fillCities(){const cities=[...new Set(currentList().map(p=>p.inventoryRow&&p.inventoryRow.city).filter(Boolean))].sort((a,b)=>a.localeCompare(b));$('cityFilter').innerHTML='<option value="">All cities</option>'+options(cities.map(c=>[c,c]),'')}
function listingRow(l){return{name:l.name,city:l.city,neighborhood:l.neighborhood||'',beds:String(l.beds??''),baths:l.baths?String(l.baths):'',sqft:l.sqft?String(l.sqft):'',sleeps:l.sleeps?String(l.sleeps):'',description:l.description||'',image:l.image||'',url:l.url||'',amenities:(Array.isArray(l.amenities)?l.amenities:String(l.amenities||'').split(/[;,]/)).map(x=>String(x).trim()).filter(Boolean).join('|'),lat:l.lat==null?'':String(l.lat),lng:l.lng==null?'':String(l.lng),notes:l.notes||''}}
function refreshSrc(){shortItems=[];webItems=[];const ids=get('chs.short',[]),snap=get('chs.snap',{});ids.forEach(id=>{const l=snap[id];if(l&&l.name&&l.city){const p=inventoryProperty(listingRow(l),0);p.id='sh:'+id;shortItems.push(p)}});const c=get('chs.liveCache',{}),seen=new Set();Object.values(c).forEach(v=>{if(!v||Date.now()-v.t>864e5)return;(v.listings||[]).forEach(l=>{if(!l||!l.name||!l.city)return;const k='w:'+l.name+'|'+l.city;if(seen.has(k))return;seen.add(k);const p=inventoryProperty(listingRow(l),0);p.id=k;webItems.push(p)})})}
const PH=()=>window.PHOTOS_URL||'',PHC={};
function propId(p){const m=String(p&&p.inventoryRow&&p.inventoryRow.notes||'').match(/Property ID (\d+)/)||String(p&&p.url||'').match(/details\/(\d+)/);return m?m[1]:''}
async function loadPhotos(i,manual){const o=S.opts[i];if(!o)return;const p=P(o.p)||BASE[0],id=propId(p);if(!PH()||!id){if(manual)say(i,'[data-pstat]',!PH()?'Photo service not set up yet (see config.js).':'No Astrid property ID for this property.');return}
try{say(i,'[data-pstat]','Loading photos…');let L=PHC[id];if(!L){const r=await fetch(PH()+'?id='+encodeURIComponent(id));if(!r.ok)throw Error('HTTP '+r.status);L=((await r.json()).photos||[]).filter(u=>/^https:\/\//.test(u));PHC[id]=L}
if(!L.length){say(i,'[data-pstat]','No photos found on the Astrid page.');return}
o.photo=L[0];o.gallery=L.slice(1,7);renderOpts();say(i,'[data-pstat]',L.length+' photos found. The first is the hero, the next '+Math.min(6,L.length-1)+' fill the gallery.')}catch(err){say(i,'[data-pstat]','Could not load photos: '+err.message)}}
function bdRows(o){const t=totals(o),R=[],qd=f=>f==='night'?' nights':' days',q=o.basis==='night'?`${t.n} night${t.n===1?'':'s'}`:o.basis==='day'?`${t.dy} day${t.dy===1?'':'s'}`:`${(t.n/30).toFixed(2)} × 30 days`;
R.push({l:'Accommodation',d:`${q} × ${money(t.r)}`,a:t.acc});
t.feeLines.forEach(f=>R.push({l:f.label,d:f.freq==='once'?'one-time fee':f.freq==='month'?`${money(f.unit)} × ${f.qty.toFixed(2)} × 30 days`:`${money(f.unit)} × ${f.qty}${qd(f.freq)}`,a:f.amt}));
if(t.taxLines.length||t.waived)R.push({l:'Subtotal before taxes',d:'',a:t.acc+t.fees,s:1});
if(t.waived)R.push({l:'Taxes',d:'waived, tax exemption',a:0});else t.taxLines.forEach(x=>R.push({l:x.label,d:x.type==='flat'?'flat amount':`${x.pct}% of ${money(t.acc+t.fees)}`,a:x.amt}));
R.push({l:'Total for stay',d:'',a:t.total,t:1});return R}
function bdTable(o){if(!o.rate)return'';const ln='1px solid #c9c2b0';return `<table style="border-collapse:collapse;font-size:12px;margin:4px 0 8px;min-width:300px">${bdRows(o).map(r=>{const b=r.t||r.s?`border-top:${ln};`:'';return `<tr style="${r.t?'font-weight:700':''}"><td style="padding:3px 16px 3px 0;border-bottom:0;${b}">${esc(r.l)}${r.d?` <span style="color:#6b6f76;font-weight:400">(${esc(r.d)})</span>`:''}</td><td style="padding:3px 0;border-bottom:0;text-align:right;white-space:nowrap;${b}">${money(r.a)}</td></tr>`}).join('')}</table>`}
function breakdownSections(){return S.opts.map((o,i)=>{const p=P(o.p)||BASE[0];return o.rate?`<h4 style="margin:16px 0 2px;font-size:13px">Option ${i+1} — ${esc(p.name)}: price breakdown</h4>${bdTable(o)}`:''}).join('')}
// CSV parser correctly handles quoted fields, embedded commas, newlines and doubled quotes.
function csvParse(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(s=>s.trim()))rows.push(row);row=[];field=''}else field+=c}if(field||row.length){row.push(field);rows.push(row)}const keys=(rows.shift()||[]).map(x=>x.replace(/^\ufeff/,'').trim());return rows.map(values=>Object.fromEntries(keys.map((key,i)=>[key,values[i]||''])))}
function realUrl(url){try{const u=new URL(url);return u.protocol==='https:'?u.href:''}catch{return''}}
function inventoryProperty(row,i){const amen=(row.amenities||'').split(/[|;,]/).map(x=>x.trim()).filter(Boolean);const beds=Number(row.beds),bath=Number(row.baths);const room=(Number.isFinite(beds)?(beds===0?'Studio':beds+'BR'):'Apartment')+(row.baths?' / '+bath+'BA':'');return{id:'inv-'+i,name:row.name,addr:row.address||[row.neighborhood,row.city].filter(Boolean).join(', '),city:row.city,am:amen,hk:'',desc:row.description||'',url:realUrl(row.url),image:realUrl(row.image),units:[{n:room,s:row.sqft?row.sqft+' sq.ft.':'',k:''}],inventoryRow:row}}
function filterInventory(){const city=$('cityFilter').value,q=$('inventoryQuery').value.trim().toLowerCase(),beds=$('bedsFilter').value;const list=currentList().filter(p=>{const r=p.inventoryRow;return(!city||r.city===city)&&(!beds||Number(r.beds)>=Number(beds))&&(!q||[r.name,r.city,r.neighborhood,r.notes,r.url].join(' ').toLowerCase().includes(q))}).slice(0,150);const previous=$('inventorySelect').value;$('inventorySelect').innerHTML='<option value="">Select a property ('+list.length+(list.length===150?'+':'')+' shown)</option>'+options(list.map(p=>[p.id,p.name+' — '+p.city]),previous);showInventory();$('inventoryStatus').textContent=currentList().length?`${list.length}${list.length===150?'+':''} matching properties displayed. Refine your search to narrow results.`:emptyMsg()}
function showInventory(){const p=P($('inventorySelect').value),box=$('inventoryInfo');if(!p||!p.inventoryRow){box.classList.add('pg-hidden');box.innerHTML='';return}const r=p.inventoryRow;box.classList.remove('pg-hidden');box.innerHTML=(p.image?`<img src="${esc(p.image)}" alt="Property photo" loading="lazy">`:'')+`<div><strong>${esc(p.name)}</strong><div class="pg-meta">${esc([r.city,r.neighborhood,r.beds+' bed',r.baths?r.baths+' bath':''].filter(Boolean).join(' · '))}</div>${p.url?`<a target="_blank" rel="noopener noreferrer" href="${esc(p.url)}">View Astrid property ↗</a>`:''}<div class="pg-meta">${esc(p.am.join(', '))}</div></div>`}
$('sourceFilter').addEventListener('change',()=>{refreshSrc();fillCities();filterInventory()});window.addEventListener('focus',()=>{if($('sourceFilter').value!=='inv'){refreshSrc();fillCities();filterInventory()}});$('cityFilter').addEventListener('change',filterInventory);$('bedsFilter').addEventListener('change',filterInventory);$('inventoryQuery').addEventListener('input',filterInventory);$('inventorySelect').addEventListener('change',showInventory);
$('useInventory').addEventListener('click',()=>{const id=$('inventorySelect').value;if(!id){$('inventoryStatus').textContent='Choose a property before adding it.';return}const pk=P(id);if(pk)S.known[id]=pk;S.opts.push(newOpt(id));renderOpts();autoDist(S.opts.length-1);loadPhotos(S.opts.length-1);$('inventoryStatus').textContent='Property added. Enter the rate, fees and confirm the details.'});
async function loadInventory(){try{$('inventoryStatus').textContent='Loading inventory.csv…';const r=await fetch('inventory.csv',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);inventory=csvParse(await r.text()).filter(r=>r.name&&r.provider==='Astrid Living');inventoryItems=inventory.map(inventoryProperty);refreshSrc();$('inventoryCount').textContent=inventoryItems.length+' properties';fillCities();filterInventory();renderOpts()}catch(err){$('inventoryCount').textContent='Unavailable';$('inventoryStatus').textContent='Could not load inventory.csv ('+err.message+'). Upload inventory.csv to the same GitHub repository folder as proposal.html.';renderOpts()}}
$('reloadInventory').addEventListener('click',loadInventory);renderOpts();loadInventory();
})();
</script></body></html>
