<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astrid Living · Proposal Generator</title>
<meta name="theme-color" content="#c1a463">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script>try{var t=JSON.parse(localStorage.getItem("chs.theme"));if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
.pg{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;padding-top:24px;padding-bottom:56px;align-items:start}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opt{border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--field)}
.opt-h{display:flex;justify-content:space-between;align-items:center;font:400 20px var(--serif);color:var(--head)}
.calc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font-size:13px}
.calc div{display:flex;justify-content:space-between;padding:2px 0}
.calc .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font:400 18px var(--serif);color:var(--head)}
.warn{background:color-mix(in srgb,var(--gold) 20%,transparent);border-radius:10px;padding:8px 12px;font-size:13px}
.feerow{display:grid;grid-template-columns:2fr 1fr 1.3fr auto;gap:8px;align-items:center}
.tabs{display:flex;gap:8px}
.tabs .btn[aria-selected=true]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.pane{border:1px solid var(--line);border-radius:14px;background:#fff;padding:18px;max-height:75vh;overflow:auto}
.doc{font:13px/1.6 Georgia,serif;color:#1a1f26;background:#fff}
.doc h3{font:400 22px Georgia,serif;margin:0 0 4px;color:#1f3347}
.doc .hd{display:flex;align-items:center;gap:10px;border-bottom:2px solid #c1a463;padding-bottom:8px;margin-bottom:12px}
.doc .hd img{height:34px}
.doc hr{border:0;border-top:1px solid #e3ddcd;margin:12px 0}
.doc .red{color:#b3261e;font-weight:600}
.doc table{width:100%;border-collapse:collapse;font-size:12px}
.doc th,.doc td{border-bottom:1px solid #e3ddcd;padding:6px 8px 6px 0;text-align:left;vertical-align:top}
.doc .ph{width:100%;max-height:230px;object-fit:cover;border-radius:6px;margin-bottom:10px}
.doc .fine{font-size:11px;color:#646b76;font-style:italic}
.pgb{page-break-after:always;padding:6px 0}
#printArea{display:none}
@media (max-width:900px){.pg{grid-template-columns:1fr}.feerow{grid-template-columns:1fr 1fr}}
@media print{body.printing>*:not(#printArea){display:none!important}body.printing #printArea{display:block}@page{margin:14mm}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap bar">
  <div class="brand"><img src="logo.png" alt="Astrid Living" onerror="this.remove()"><span class="studio">Proposal Generator</span></div>
  <div class="bar-right"><a class="btn" href="./">← Sourcing Studio</a></div>
</div></header>

<main class="wrap pg">
  <div style="display:flex;flex-direction:column;gap:24px">
    <section class="panel">
      <h2>Proposal details</h2>
      <div class="g">
        <label style="grid-column:1/-1">Proposal name<input id="pname" value="Temporary Housing Proposal"></label>
        <label>Client / company<input id="client" placeholder="e.g. Mission of Australia"></label>
        <label>Guest name<input id="guest" value="TBD"></label>
        <label>Move-in<input id="mi" type="date"></label>
        <label>Move-out<input id="mo" type="date"></label>
        <label>Valid until<input id="valid" type="date"></label>
        <label style="grid-column:1/-1">Preferred location (distances are measured to it)<input id="ref" placeholder="e.g. 711 3rd Ave, New York, NY"></label>
        <label style="grid-column:1/-1">General comments<textarea id="gc" rows="2" maxlength="500"></textarea></label>
        <label style="grid-column:1/-1">Attachments
          <input id="files" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.docx">
          <span class="meta" id="flist">Files are listed in the email reminder only; attach them to your email manually.</span></label>
      </div>
    </section>
    <section class="panel">
      <h2>Property options</h2>
      <span class="meta" id="invst">Loading Astrid inventory…</span>
      <div id="opts" style="display:flex;flex-direction:column;gap:16px"></div>
      <button class="btn primary" id="add" type="button">+ Add property option</button>
    </section>
  </div>

  <aside class="panel" aria-label="Preview">
    <h2>Preview</h2>
    <div class="tabs" role="tablist">
      <button class="btn" role="tab" id="t-mail" aria-selected="true" type="button">Email</button>
      <button class="btn" role="tab" id="t-pdf" aria-selected="false" type="button">PDF &amp; profiles</button>
    </div>
    <div class="pane"><div class="doc" id="out"></div></div>
    <div class="dlg-actions" style="justify-content:flex-start">
      <button class="btn primary" id="copy" type="button">Copy email</button>
      <button class="btn" id="print" type="button">Print / Save as PDF</button>
    </div>
    <div class="meta" id="msg" aria-live="polite"></div>
  </aside>
</main>

<dialog id="dp">
  <form id="fp" class="addform" method="dialog">
    <h2>New property</h2>
    <label>Name<input name="name" required></label>
    <label>Address<input name="addr" required></label>
    <label>City<input name="city" required></label>
    <label>Amenities (comma-separated)<input name="am" placeholder="24-Hour Front Desk, Elevator, Laundry"></label>
    <label>Housekeeping<input name="hk" placeholder="Weekly (complimentary)"></label>
    <label>Description<textarea name="desc" rows="3"></textarea></label>
    <label>Room types (one per line: name | size | kitchen)<textarea name="units" rows="3" placeholder="Studio Queen | 350 sq.ft. | Fully equipped kitchen"></textarea></label>
    <div class="dlg-actions"><button type="button" class="btn" id="pc">Cancel</button><button class="btn primary">Save property</button></div>
  </form>
</dialog>
<div id="printArea"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var money=function(n){return"$"+(isFinite(n)?n:0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})};
var MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
var pretty=function(d){if(!d)return"—";var p=d.split("-");return MN[+p[1]-1]+" "+(+p[2])+", "+p[0]};
var nts=function(a,b){if(!a||!b)return 0;var d=(new Date(b)-new Date(a))/864e5;return d>0?Math.round(d):0};
var store={get:function(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* property library: starter properties + ones you add (saved in this browser) */
var BASE=[
 {id:"midtown",city:"New York",name:"Midtown East ApartHotel",addr:"East 49th St. & 1st Ave. New York, NY, 10017",am:["24-Hour Front Desk","Elevator","Laundry Onsite","Pet-friendly property (addl fees and restrictions)"],hk:"Bi-weekly (complimentary)",desc:"",
  units:[{n:"Studio Queen",s:"350 sq.ft.",k:"Fully equipped kitchen"},{n:"One Bedroom",s:"520 sq.ft.",k:"Fully equipped kitchen"}]},
 {id:"marmara",city:"New York",name:"The Marmara Residence",addr:"East 32nd St. & Park Ave. New York, NY, 10016",am:["24-Hour Front Desk","Elevator","Indoor Swimming Pool","Laundry Onsite"],hk:"Weekly (complimentary)",desc:"",
  units:[{n:"Studio Queen",s:"400 sq.ft.",k:"Kitchenette with two-burner stoves"},{n:"One Bedroom Deluxe",s:"610 sq.ft.",k:"Kitchenette with two-burner stoves"}]},
 {id:"sora",city:"Inglewood",name:"Sora Residences",addr:"E Hazel & Centinela Ave, Inglewood, CA 90302",am:["Resort-style Pool","Fitness Center","In-unit Laundry","High Speed WiFi","EV Charging","Outdoor Lounge"],hk:"On request",
  desc:"Designed for effortless living, this modern Inglewood residence offers spacious, fully furnished apartments with stylish interiors and in-unit laundry, close to SoFi Stadium and LAX.",
  units:[{n:"1BR / 1BA",s:"607 sq.ft.",k:"Fully equipped kitchen, stainless steel"}]}
];
var custom=store.get("ast.props",[]);
var INV=[],SH=[],WB=[];
var EMPTY={id:"",name:"",addr:"",city:"",am:[],hk:"",desc:"",units:[]};
var mine=function(){return BASE.concat(custom)};
var props=function(){return mine().concat(INV,SH,WB)};
var P=function(id){return props().filter(function(p){return p.id===id})[0]||((S&&S.known)||{})[id]||EMPTY};
var listFor=function(src){return src==="inv"?INV:src==="short"?SH:src==="web"?WB:mine()};
var citiesFor=function(src){var c={};listFor(src).forEach(function(p){if(p.city)c[p.city]=1});return Object.keys(c).sort()};

var draft=store.get("ast.draft",null);
var S=draft||{opts:[]};
S.known=S.known||{};
function newOpt(){var p=BASE[0],u=p.units[0]||{};return{src:"custom",city:p.city,p:p.id,u:u.n||"",s:u.s||"",k:u.k||"",own:false,mi:"",mo:"",rate:"",basis:"night",tm:"waived",tp:14.75,dist:"",fees:[],photo:"",note:""}}
if(!S.opts.length)S.opts.push(newOpt());
S.opts.forEach(function(o){o.src=o.src||"custom";if(o.city==null)o.city=P(o.p).city||""});
var F=["pname","client","guest","mi","mo","valid","ref","gc"];
F.forEach(function(f){if(S[f]!=null)$(f).value=S[f]});

function save(){F.forEach(function(f){S[f]=$(f).value});
  store.set("ast.draft",{known:S.known,pname:S.pname,client:S.client,guest:S.guest,mi:S.mi,mo:S.mo,valid:S.valid,ref:S.ref,gc:S.gc,
   opts:S.opts.map(function(o){var c=JSON.parse(JSON.stringify(o));c.photo="";return c})})}

function dates(o){return o.own?{a:o.mi,b:o.mo}:{a:$("mi").value,b:$("mo").value}}
function totals(o){var d=dates(o),n=nts(d.a,d.b),r=parseFloat(o.rate)||0,acc=(o.basis==="night"?n:n/30)*r,fee=0;
  o.fees.forEach(function(f){var a=parseFloat(f.amt)||0;fee+=f.freq==="night"?a*n:f.freq==="month"?a*n/30:a});
  var pre=acc+fee,tax=pre*(parseFloat(o.tp)||0)/100,w=o.tm==="waived";
  return{n:n,acc:acc,fee:fee,tax:tax,w:w,total:w?pre:pre+tax,r:r}}

/* ---------- option cards ---------- */
function optHtml(o,i){
  var pr=P(o.p),t=totals(o),d=dates(o),sel=function(v,x){return v===x?" selected":""},
    lst=(o.src==="inv"&&!o.city)?[]:listFor(o.src).filter(function(p){return !o.city||p.city===o.city}),
    ph=(o.src==="inv"&&!o.city)?"Choose a city first":!lst.length?(o.src==="short"?"Nothing shortlisted yet (shortlist on the main page)":o.src==="web"?"No recent web results (run Live search first)":"No properties"):"Choose a property…";
  var short=t.n>0&&t.n<(o.minN||0);
  return '<div class="opt" data-i="'+i+'"><div class="opt-h"><span>Option '+(i+1)+'</span>'
   +(S.opts.length>1?'<button type="button" class="btn danger" data-a="rm" data-i="'+i+'">Remove</button>':'')+'</div>'
   +'<div class="g"><label>Source<select data-k="src"><option value="inv"'+sel("inv",o.src)+'>Astrid inventory</option><option value="short"'+sel("short",o.src)+'>Shortlist</option><option value="web"'+sel("web",o.src)+'>Found on the web</option><option value="custom"'+sel("custom",o.src)+'>My properties &amp; samples</option></select></label>'
   +'<label>City<select data-k="city"><option value="">'+(o.src==="inv"?"Choose a city…":"All cities")+'</option>'+citiesFor(o.src).map(function(c){return'<option'+sel(c,o.city)+'>'+esc(c)+'</option>'}).join("")+'</select></label>'
   +'<label style="grid-column:1/-1">Property<select data-k="p"><option value="">'+ph+'</option>'
   +lst.map(function(p){return'<option value="'+esc(p.id)+'"'+sel(p.id,o.p)+'>'+esc(p.name+(p.hood?" — "+p.hood:""))+'</option>'}).join("")
   +'</select></label><button type="button" class="btn linky" data-a="newp" style="grid-column:1/-1;justify-self:start">+ New property</button>'
   +'<label>Room type<input data-k="u" list="u'+i+'" value="'+esc(o.u)+'"><datalist id="u'+i+'">'+pr.units.map(function(u){return'<option value="'+esc(u.n)+'">'}).join("")+'</datalist></label>'
   +'<label>Size<input data-k="s" value="'+esc(o.s)+'"></label>'
   +'<label style="grid-column:1/-1">Kitchen<input data-k="k" value="'+esc(o.k)+'"></label>'
   +'<label style="grid-column:1/-1">Photo (shown on the property profile)<input data-k="photo" type="file" accept="image/*"></label></div>'
   +'<label class="check"><input type="checkbox" data-k="own"'+(o.own?" checked":"")+'> This option uses its own dates</label>'
   +'<div class="g"><label>Move-in<input data-k="mi" type="date" value="'+d.a+'"'+(o.own?"":" disabled")+'></label>'
   +'<label>Move-out<input data-k="mo" type="date" value="'+d.b+'"'+(o.own?"":" disabled")+'></label>'
   +'<label>Nights<input data-o="n" value="'+t.n+'" readonly></label></div>'
   +'<div class="g"><label>Daily rate (USD)<input data-k="rate" type="number" min="0" step="1" value="'+esc(o.rate)+'"></label>'
   +'<label>Rate basis<select data-k="basis"><option value="night"'+sel("night",o.basis)+'>Per night</option><option value="month"'+sel("month",o.basis)+'>Per month</option></select></label>'
   +'<label>Taxes<select data-k="tm"><option value="waived"'+sel("waived",o.tm)+'>Waived (exemption)</option><option value="added"'+sel("added",o.tm)+'>Added to total</option></select></label>'
   +'<label>Tax %<input data-k="tp" type="number" min="0" step="0.01" value="'+esc(o.tp)+'"></label></div>'
   +'<label>Distance from preferred location<input data-k="dist" value="'+esc(o.dist)+'" placeholder="e.g. 0.5 miles (11-minute walk)"></label>'
   +'<div><span class="meta">Mandatory fees</span><div id="fees'+i+'" style="display:flex;flex-direction:column;gap:8px;margin:6px 0">'
   +o.fees.map(function(f,j){return'<div class="feerow"><input data-f="label" data-j="'+j+'" value="'+esc(f.label)+'" placeholder="Cleaning"><input data-f="amt" data-j="'+j+'" type="number" min="0" value="'+esc(f.amt)+'">'
     +'<select data-f="freq" data-j="'+j+'"><option value="once"'+sel("once",f.freq)+'>One-time</option><option value="night"'+sel("night",f.freq)+'>Per night</option><option value="month"'+sel("month",f.freq)+'>Per month</option></select>'
     +'<button type="button" class="btn linky" data-a="rmfee" data-j="'+j+'">Remove</button></div>'}).join("")
   +'</div><button type="button" class="btn linky" data-a="addfee">+ Add fee</button></div>'
   +'<label>Notes (print in red on the proposal)<textarea data-k="note" rows="2">'+esc(o.note)+'</textarea></label>'
   +'<div class="calc" data-calc></div><div class="warn" data-warn hidden></div></div>'}

function calcHtml(o){var t=totals(o);
  return'<div><span>'+(o.basis==="night"?t.n+" nights × "+money(t.r):(t.n/30).toFixed(2)+" months × "+money(t.r))+'</span><span>'+money(t.acc)+'</span></div>'
   +'<div><span>Fees</span><span>'+(t.fee?money(t.fee):"None")+'</span></div>'
   +'<div><span>Applicable taxes</span><span'+(t.w?' style="text-decoration:line-through"':'')+'>'+money(t.tax)+'</span></div>'
   +'<div class="tot"><span>Total for the stay</span><span>'+money(t.total)+'</span></div>'}

function renderOpts(){refreshSrc();$("opts").innerHTML=S.opts.map(optHtml).join("");patch()}
function patch(){S.opts.forEach(function(o,i){var c=document.querySelector('.opt[data-i="'+i+'"]');if(!c)return;
  var t=totals(o),d=dates(o);c.querySelector("[data-calc]").innerHTML=calcHtml(o);
  c.querySelector('[data-o="n"]').value=t.n;
  if(!o.own){c.querySelector('[data-k="mi"]').value=d.a;c.querySelector('[data-k="mo"]').value=d.b}});
  save();preview()}

/* ---------- previews ---------- */
var tab="mail";
function logo(){return'<img src="logo.png" alt="Astrid Living" onerror="this.remove()">'}
function mailHtml(){var h='<div class="hd">'+logo()+'</div>';
  h+="Dear "+esc($("client").value.trim()||"[Client Name]")+",<br><br>Thank you for considering Astrid Living for the upcoming stay.<br>We are pleased to share the option"+(S.opts.length>1?"s":"")+" below for your review.";
  if($("gc").value.trim())h+="<br>"+esc($("gc").value.trim());
  h+="<br><br><b>Guest Name:</b> "+esc($("guest").value||"TBD");
  S.opts.forEach(function(o,i){var p=P(o.p),t=totals(o),d=dates(o);
    h+='<hr><b>Option '+(i+1)+"</b><br><b>"+esc(p.name)+"</b><br>"+esc(p.addr)+"<br><br>"
     +"<b>Move in:</b> "+pretty(d.a)+" &nbsp; <b>Move out:</b> "+pretty(d.b)+" ("+t.n+" nights)<br>"
     +"<b>Distance to "+esc($("ref").value||"preferred location")+":</b> "+esc(o.dist||"—")+"<br>"
     +"<b>Apartment type &amp; size:</b> "+esc(o.u)+" ("+esc(o.s)+")"+(o.k?" - "+esc(o.k):"")+"<br>"
     +"<b>Rate:</b> "+money(t.r)+" per "+(o.basis==="night"?"night":"month")+"<br>"
     +"<b>Total for the stay:</b> "+money(t.total)+(t.w?" (taxes waived with Tax Exemption Certificate)":" (taxes included)")+"<br>"
     +"<b>Housekeeping:</b> "+esc(p.hk||"—")+"<br><b>Property Amenities:</b> "+esc(p.am.join(", "))+"<br>"
     +(o.note?'<span class="red">Notes: '+esc(o.note)+"</span><br>":"")});
  return h+'<hr>All apartments are fully furnished with equipped kitchens or kitchenettes, linens, towels, complimentary Wi-Fi, and cable/smart TV.<br>'
   +'<span class="fine">Please note: Website images are for illustration and may not reflect the exact design, décor, or layout of your unit.</span><br><br>'
   +"This proposal is valid until <b>"+pretty($("valid").value)+"</b>.<br><br>Best regards,<br><b>Karina</b><br>Astrid Living"}

function pdfHtml(){
  var rows=S.opts.map(function(o,i){var p=P(o.p),t=totals(o),d=dates(o);
    return"<tr><td>Option "+(i+1)+"</td><td><b>"+esc(p.name)+"</b><br>"+esc(p.addr)+"</td><td>"+esc(o.u)+"<br>"+esc(o.s)+"</td><td>"+pretty(d.a)+"<br>"+pretty(d.b)+"<br>"+t.n+" nights</td><td>"+esc(o.dist||"—")+"</td><td>"+money(t.r)+"</td><td><b>"+money(t.total)+"</b>"+(t.w?"<br>tax waived":"")+"</td></tr>"}).join("");
  var h='<div class="pgb"><div class="hd">'+logo()+'<b style="margin-left:auto">'+esc($("pname").value)+"</b></div>"
   +"<h3>"+esc($("client").value||"[Client Name]")+"</h3><p class='fine'>Guest: "+esc($("guest").value||"TBD")+" · Distances measured to "+esc($("ref").value||"—")+" · Valid until "+pretty($("valid").value)+"</p>"
   +"<table><tr><th></th><th>Property</th><th>Unit</th><th>Dates</th><th>Distance</th><th>Rate</th><th>Total</th></tr>"+rows+"</table>"
   +($("gc").value.trim()?"<p>"+esc($("gc").value.trim())+"</p>":"")+"</div>";
  S.opts.forEach(function(o){var p=P(o.p);
    h+='<div class="pgb"><div class="hd">'+logo()+"</div>"+((o.photo||p.img)?'<img class="ph" src="'+esc(o.photo||p.img)+'" alt="">':"")
     +"<h3>"+esc(p.name)+"</h3><p><i>"+esc(p.addr)+"</i><br><b>"+esc(o.dist||"")+(o.dist&&$("ref").value?" to "+esc($("ref").value):"")+"</b></p>"
     +(p.desc?"<p>"+esc(p.desc)+"</p>":"")+"<b>Building highlights</b><ul>"+p.am.map(function(a){return"<li>"+esc(a)+"</li>"}).join("")+"</ul>"
     +"<b>Services</b><ul><li>Housekeeping — "+esc(p.hk||"On request")+"</li></ul>"
     +"<b>Apartment features</b><ul><li>"+esc(o.u)+" — "+esc(o.s)+"</li>"+(o.k?"<li>"+esc(o.k)+"</li>":"")+"</ul>"
     +'<p class="fine">Website images are for illustration and may not reflect the exact design, décor or layout of your unit.</p></div>'});
  return h}
function preview(){$("out").innerHTML=tab==="mail"?mailHtml():pdfHtml()}

/* ---------- events ---------- */
function toast(m){$("msg").textContent=m;setTimeout(function(){$("msg").textContent=""},3500)}
F.forEach(function(f){$(f).addEventListener("input",patch)});
$("files").addEventListener("change",function(){var n=[].map.call(this.files,function(f){return f.name});$("flist").textContent=n.length?"Attach to your email: "+n.join(", "):"Files are listed here only; attach them to your email manually."});
$("opts").addEventListener("input",function(e){var el=e.target,c=el.closest(".opt");if(!c)return;var o=S.opts[+c.dataset.i];
  if(el.dataset.f){o.fees[+el.dataset.j][el.dataset.f]=el.value;patch();return}
  var k=el.dataset.k;if(!k)return;
  if(k==="photo"){var fl=el.files[0];if(!fl)return;var r=new FileReader();r.onload=function(){o.photo=r.result;preview()};r.readAsDataURL(fl);return}
  o[k]=el.type==="checkbox"?el.checked:el.value;
  if(k==="rate")o.auto=false;
  if(k==="src"){o.src=el.value;o.city="";o.p="";o.u=o.s=o.k="";renderOpts();return}
  if(k==="city"){o.city=el.value;o.p="";o.u=o.s=o.k="";renderOpts();return}
  if(k==="p"){var pp=P(o.p),u=pp.units[0]||{};if(pp.id)S.known[pp.id]=pp;o.u=u.n||"";o.s=u.s||"";o.k=u.k||"";if(pp.monthly&&(o.auto||!o.rate)){o.rate=Math.round(pp.monthly/30);o.auto=true}renderOpts();return}
  if(k==="u"){var m=P(o.p).units.filter(function(u){return u.n===o.u})[0];if(m){o.s=m.s;o.k=m.k;renderOpts();return}}
  if(k==="own"){if(o.own){o.mi=$("mi").value;o.mo=$("mo").value}renderOpts();return}

function parseCsv(t){var r=[],row=[],c="",q=false;for(var i=0;i<t.length;i++){var ch=t[i];
 if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch==='"')q=true;else if(ch===","){row.push(c);c=""}
 else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(c);c="";if(row.length>1||row[0]!=="")r.push(row);row=[]}
 else c+=ch}
 if(c!==""||row.length){row.push(c);r.push(row)}return r}
function num(v){return +v||0}
function norm(o){if(!o||!o.name||!o.city)return null;
 var am=Array.isArray(o.amenities)?o.amenities:String(o.amenities||"").split(/[;,]/).map(function(x){return x.trim()}).filter(Boolean);
 return{name:String(o.name).trim(),city:String(o.city).trim(),neighborhood:String(o.neighborhood||"").trim(),beds:num(o.beds),baths:num(o.baths),sqft:num(o.sqft),monthly:num(o.monthly),amenities:am,description:String(o.description||"").trim(),image:/^https:\/\//.test(o.image||"")?o.image:"",url:/^https?:\/\//.test(o.url||"")?o.url:""}}
function toProp(l,id){var u={n:l.beds===0?"Studio":l.beds+"BR"+(l.baths?" / "+l.baths+"BA":""),s:l.sqft?l.sqft+" sq.ft.":"",k:""};
 return{id:id,name:l.name,addr:[l.neighborhood,l.city].filter(Boolean).join(", "),city:l.city,hood:l.neighborhood||"",am:l.amenities||[],hk:"",desc:l.description||"",img:l.image||"",url:l.url||"",monthly:l.monthly||0,units:[u]}}
function refreshSrc(){
 var ids=store.get("chs.short",[]),snap=store.get("chs.snap",{});
 SH=ids.map(function(id){var l=norm(snap[id]);return l?toProp(l,"s:"+id):null}).filter(Boolean);
 var c=store.get("chs.liveCache",{}),seen={};WB=[];
 Object.keys(c).forEach(function(k){if(!c[k]||Date.now()-c[k].t>864e5)return;(c[k].listings||[]).forEach(function(o){var l=norm(o);if(!l)return;var key="w:"+l.name+"|"+l.city;if(seen[key])return;seen[key]=1;WB.push(toProp(l,key))})})}
function loadInv(){fetch("inventory.csv").then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
 var rows=parseCsv(t.replace(/^\uFEFF/,"")),H=rows.shift().map(function(h){return h.trim()});
 INV=rows.map(function(r,n){var o={};H.forEach(function(h,j){o[h]=(r[j]||"").trim()});var l=norm(o);if(!l)return null;
  var pid=(String(o.notes||"").match(/Property ID (\d+)/)||[])[1];return toProp(l,"h"+(pid||"i"+n))}).filter(Boolean);
 $("invst").textContent=INV.length+" Astrid inventory properties loaded.";renderOpts();
}).catch(function(){$("invst").textContent="Could not load inventory.csv; only the shortlist, web results and added properties are available."})}

loadInv();
